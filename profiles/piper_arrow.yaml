name: "Piper PA-28R Arrow III / Turbo Arrow III & IV (Just Flight)"
description: "Complex single-engine mapping for the Just Flight PA-28R Arrow III, Turbo Arrow III (PA-28R-201T) and Turbo Arrow IV (PA-28RT-201T). Same yoke/pedals/trim hardware as the C172 profile; the TQ6+ gains the constant-speed PROPELLER lever (the Arrow is a complex aircraft). Uses standard SimConnect events — no Just Flight LVars needed. Scope is the flight-control + engine axes only; gear, flaps and panel switches live on the user's Saitek panels via SPAD.neXt."

# JF in-sim titles vary; these case-insensitive substrings cover all 3 variants.
# Verify with the actual aircraft TITLE if a variant fails to auto-select.
aircraft_match:
  - "Arrow III"
  - "Arrow IV"
  - "Turbo Arrow"
  - "PA-28R"
  - "PA28R"
  - "PA-28RT"

bindings:
  # --- Fulcrum One Yoke (same calibration as the C172 profile, 2026-06-20) ---
  # ABS_X(0)=roll (raw 0 = full LEFT), ABS_Y(1)=pitch (raw rises pulling back =
  # nose up -> elevator invert:true). Hardware ranges come from
  # config/calibration.yaml. Flip an invert if reversed in the sim.
  yoke:
    - name: "Aileron (roll)"
      source: { kind: axis, code: 0 }
      action: { type: event, event: AILERON_SET }
      transform: { deadzone: 0.03, curve: expo, expo: 0.25, invert: true, out_min: -16383, out_max: 16383 }
    - name: "Elevator (pitch)"
      source: { kind: axis, code: 1 }
      action: { type: event, event: ELEVATOR_SET }
      transform: { deadzone: 0.03, curve: expo, expo: 0.25, invert: true, out_min: -16383, out_max: 16383 }
    # --- Yoke grip buttons (codes & labels in config/calibration.yaml) ---
    # Flight-deck functions, fire once on press. Gear & flaps stay on the
    # Saitek panels via SPAD.neXt (out of scope here).
    - name: "ATC window"           # 288 left grip, red button
      # Open/close the ATC window. `ATC` (the FSX-era event) does NOT reliably
      # toggle the window in MSFS 2020; SIMUI_WINDOW_HIDESHOW is the documented
      # UI-window toggle. NOTE: the window must be enabled in the MSFS toolbar at
      # least once before an external switch can toggle it.
      source: { kind: button, code: 288 }
      action: { type: event, event: ATC_0 }
    - name: "Parking brake"        # 289 left grip, black button
      source: { kind: button, code: 289 }
      action: { type: event, event: PARKING_BRAKES }
    - name: "Fuel selector LEFT"   # 294 right rocker, left
      source: { kind: button, code: 294 }
      action: { type: event, event: FUEL_SELECTOR_LEFT }
    - name: "Fuel selector RIGHT"  # 295 right rocker, right
      source: { kind: button, code: 295 }
      action: { type: event, event: FUEL_SELECTOR_RIGHT }
    - name: "Heading bug = current heading"   # 290 left rocker up
      # Dynamic action: on press the bridge reads the live magnetic heading and
      # fires HEADING_BUG_SET with it, snapping the AP heading bug to where the
      # nose points. Same effect as the SPAD.neXt mapping
      # "AUTOPILOT HEADING LOCK DIR := PLANE HEADING DEGREES MAGNETIC".
      source: { kind: button, code: 290 }
      action:
        type: event_from_var
        read: "PLANE HEADING DEGREES MAGNETIC"
        unit: degrees
        event: HEADING_BUG_SET
    # NOT mapped yet:
    #   291 left rocker down, 292/293 right grip black (lower/upper): unassigned.
    #   hat 16/17: unassigned (also needs direction-aware hat mapping).
    # Verify in-sim: ATC window event name may differ in MSFS 2024.

  # --- VirtualFly TQ6+ : single-engine COMPLEX -> Throttle + Prop + Mixture ---
  # codes 0..5 left->right = T1,T2,P1,P2,M1,M2. raw 0 = lever fully FORWARD
  # (max power / max RPM / full rich); raw rises pulling back; the detent is the
  # idle / min-RPM / cut-off gate, beyond it = reverse/feather (unused on a
  # piston single) so we clamp raw_max at the detent. Inverted so raw 0 -> +16383.
  # These raw_max values are deliberate semantic sub-ranges (clamp at detent /
  # full travel to cut-off), so they stay explicit and override calibration.
  tq6:
    - name: "Throttle 1"
      source: { kind: axis, code: 0, raw_min: 0, raw_max: 3275 }
      action: { type: event, event: THROTTLE1_SET }
      transform: { invert: true, out_min: 0, out_max: 16383 }
    - name: "Propeller 1 (RPM)"
      # Constant-speed prop: full forward = max RPM (fine). Clamp at the feather
      # detent — the Arrow's prop governs RPM but does not feather.
      source: { kind: axis, code: 2, raw_min: 0, raw_max: 3261 }
      action: { type: event, event: PROP_PITCH1_SET }
      transform: { invert: true, out_min: 0, out_max: 16383 }
    - name: "Mixture 1"
      # raw_max clamped at the lever's full-back hardware stop (~3227, measured
      # in-sim) so fully pulled back reaches idle cut-off (mixture 0%).
      source: { kind: axis, code: 4, raw_min: 0, raw_max: 3227 }
      action: { type: event, event: MIXTURE1_SET }
      transform: { invert: true, out_min: 0, out_max: 16384 }

  # --- Saitek Cessna Trim Wheel (same as C172) ---
  # ABS_X bounded; wheel forward ("nose down")=raw min, back ("nose up")=raw max.
  # Range from calibration.yaml.
  trim:
    - name: "Elevator trim"
      source: { kind: axis, code: 0 }
      action: { type: event, event: ELEVATOR_TRIM_SET }
      transform: { out_min: -16383, out_max: 16383 }

  # --- Saitek Rudder Pedals (same as C172) ---
  # rudder ABS_RZ(5) centre 252; toe brakes ABS_X(0)=LEFT, ABS_Y(1)=RIGHT.
  # Ranges from calibration.yaml.
  pedals:
    - name: "Rudder"
      source: { kind: axis, code: 5 }
      action: { type: event, event: RUDDER_SET }
      transform: { deadzone: 0.05, invert: true, out_min: -16383, out_max: 16383 }
    - name: "Brake left"
      source: { kind: axis, code: 0 }
      action: { type: event, event: AXIS_LEFT_BRAKE_SET }
      transform: { out_min: -16383, out_max: 16383 }
    - name: "Brake right"
      source: { kind: axis, code: 1 }
      action: { type: event, event: AXIS_RIGHT_BRAKE_SET }
      transform: { out_min: -16383, out_max: 16383 }

  # --- Saitek Pro Flight Switch Panel (raw HID, 3-byte report) ---
  # `code` is the global bit index = byte*8 + bit, mapped empirically 2026-06-24:
  #   byte0: 0 BAT  1 ALT  2 AVIONICS  3 FUEL PUMP  4 DE-ICE  5 PITOT  6 COWL  7 PANEL
  #   byte1: 8 BEACON 9 NAV 10 STROBE 11 TAXI 12 LANDING | 13 MAG-OFF 14 MAG-R 15 MAG-L
  #   byte2: 16 MAG-BOTH 17 MAG-START | 18 GEAR-UP 19 GEAR-DOWN
  #
  # kind: switch -> WITHOUT `value` = stateful: forwards on/off as 1/0 to a
  # `*_SET` event (toggle switches). WITH `value` = momentary: fires only on the
  # enter edge (rotary detents, gear lever).
  #
  # VERIFY in-sim: the electrical/fuel/anti-ice SET event names below are
  # best-effort — adjust any that don't move the right switch in the Arrow.
  switch_panel:
    # Toggle switches -> stateful *_SET (on=1 / off=0)
    - name: "Battery master"
      source: { kind: switch, code: 0 }
      action: { type: event, event: MASTER_BATTERY_SET }      # confirmed in-sim 2026-06-24
    - name: "Alternator"
      source: { kind: switch, code: 1 }
      action: { type: event, event: ALTERNATOR_SET }          # confirmed in-sim 2026-06-24
    # Electric fuel pump: JF custom LVar, written via the MobiFlight WASM channel
    # (plain *_SET is a no-op here). Stateful switch -> on writes 1 (LO), off 0.
    # JF pump is 3-way OFF/LO/HI; the 2-pos Saitek switch covers off/LO. SPAD used
    # the inverse polarity (on->0); if it ends up inverted in-sim, swap on the var.
    - name: "Electric fuel pump"
      source: { kind: switch, code: 3 }
      action: { type: simvar, simvar: "L:CENTRE_LOWER_FUELPUMP", unit: "number" }
    # Avionics master still needs a multi-step sequence (events + L:KN62_POWER),
    # not a single var — pending an RPN/sequence action. SPAD recipe:
    #   on:  AVIONICS_MASTER_SET 1; AVIONICS_MASTER_1_ON; AVIONICS_MASTER_2_ON;
    #        L:KN62_POWER=1; COM1_VOLUME_SET 100; COM2_VOLUME_SET 100; TRANSPONDERON
    #   off: reverse
    # - name: "Avionics master"
    #   source: { kind: switch, code: 2 }
    #   action: { type: event, event: AVIONICS_MASTER_SET }   # no-op on JF Arrow
    - name: "De-ice / anti-ice"
      source: { kind: switch, code: 4 }
      action: { type: event, event: ANTI_ICE_SET }
    - name: "Pitot heat"
      source: { kind: switch, code: 5 }
      action: { type: event, event: PITOT_HEAT_SET }
    # Cowl flaps NOT mapped: COWLFLAP1_SET expects a 0..16383 position, but a
    # switch only sends 0/1 (no transform yet on switches). Add later via a
    # SimVar or a scaled switch action.
    - name: "Panel lights"
      source: { kind: switch, code: 7 }
      action: { type: event, event: PANEL_LIGHTS_SET }
    - name: "Beacon lights"
      source: { kind: switch, code: 8 }
      action: { type: event, event: BEACON_LIGHTS_SET }
    # Nav lights: currently UNUSED (user 2026-06-24); left mapped but harmless.
    - name: "Nav lights"
      source: { kind: switch, code: 9 }
      action: { type: event, event: NAV_LIGHTS_SET }      # unused
    # Strobe switch = the cockpit "Anti Collision" control; confirmed in-sim 2026-06-24.
    - name: "Strobe lights"
      source: { kind: switch, code: 10 }
      action: { type: event, event: STROBES_SET }         # confirmed (= anti-collision)
    - name: "Taxi lights"
      source: { kind: switch, code: 11 }
      action: { type: event, event: TAXI_LIGHTS_SET }
    - name: "Landing lights"
      source: { kind: switch, code: 12 }
      action: { type: event, event: LANDING_LIGHTS_SET }
    # Magneto / starter rotary -> momentary, fires on entering each detent.
    # Single-engine: engine 1. START is spring-loaded back to BOTH.
    # BUG (in-sim 2026-06-24, JF Arrow): engine starts & it's usable, but the
    # LEFT (L) detent mis-registers as its neighbour in the travel direction.
    #   Up   OFF-R-L-BOTH-START arrives as OFF-R-BOTH-BOTH-START (L -> BOTH)
    #   Down START-BOTH-L-R-OFF arrives as BOTH-BOTH-R-R-OFF       (L -> R)
    # (START springing back to BOTH after ~1s is correct/expected.) Likely the
    # hidraw bit map for code 15 (L) vs 16 (BOTH) or a fast-rotate diff/edge issue
    # in hidraw_reader — needs re-measuring the L detent. TODO fix; tolerable for now.
    - name: "Magneto OFF"
      source: { kind: switch, code: 13 }
      action: { type: event, event: MAGNETO1_OFF, value: 1 }
    - name: "Magneto RIGHT"
      source: { kind: switch, code: 14 }
      action: { type: event, event: MAGNETO1_RIGHT, value: 1 }
    - name: "Magneto LEFT"
      source: { kind: switch, code: 15 }
      action: { type: event, event: MAGNETO1_LEFT, value: 1 }
    - name: "Magneto BOTH"
      source: { kind: switch, code: 16 }
      action: { type: event, event: MAGNETO1_BOTH, value: 1 }
    - name: "Magneto START"
      source: { kind: switch, code: 17 }
      action: { type: event, event: MAGNETO1_START, value: 1 }
    # Gear lever -> momentary on the enter edge.
    - name: "Gear up"
      source: { kind: switch, code: 18 }
      action: { type: event, event: GEAR_UP, value: 1 }
    - name: "Gear down"
      source: { kind: switch, code: 19 }
      action: { type: event, event: GEAR_DOWN, value: 1 }

  # Multi Panel buttons/flaps/auto-throttle (hidraw bit codes, measured map in
  # docs/memory/multi-panel-hid.md). The selector + encoder are NOT here — they
  # are owned by the multi_panel controller under `outputs:` below.
  multi_panel:
    - name: "AP master"
      source: { kind: switch, code: 7 }
      action: { type: event, event: AP_MASTER, value: 1 }   # toggles AP on/off
    # AUTO THROTTLE arm switch -> autopilot airspeed hold (user's choice; the
    # Arrow has no real autothrottle). Maintained switch -> toggles on the arm edge.
    - name: "Auto throttle (AP airspeed hold)"
      source: { kind: switch, code: 15 }
      action: { type: event, event: AP_AIRSPEED_HOLD, value: 1 }
    # Flaps rocker: momentary up/down, one notch per press (as SPAD: DECR/INCR).
    - name: "Flaps up"
      source: { kind: switch, code: 16 }
      action: { type: event, event: FLAPS_DECR, value: 1 }
    - name: "Flaps down"
      source: { kind: switch, code: 17 }
      action: { type: event, event: FLAPS_INCR, value: 1 }
    # Mode buttons HDG/NAV/APR/REV (codes 8/9/13/14): JF Arrow drives these via
    # L:AUTOPILOT_MODE/_HDG, and their LEDs need an L: read. Deferred to the LVar
    # pass — see docs/memory/multi-panel-hid.md.

# Panel outputs (LEDs), streamed back from the bridge. The Switch Panel has 3
# gear-indicator lights (nose/left/right), each green=down&locked / red=in
# transit / off=up — and dark when the battery is off. Mirrors the SPAD.neXt
# Arrow logic: GEAR x POSITION (Percent Over 100), green at >=0.95, gated by
# ELECTRICAL MASTER BATTERY. The nose wheel is the *centre* gear in MSFS.
outputs:
  switch_panel:
    - type: gear_leds
      nose: "GEAR CENTER POSITION"
      left: "GEAR LEFT POSITION"
      right: "GEAR RIGHT POSITION"
      down_at: 0.95
      power: "ELECTRICAL MASTER BATTERY"

  # Multi Panel controller: the 5-way selector picks which autopilot reference
  # value the encoder edits and the top display row shows; the button LEDs show
  # AP master (+ active mode once the L: read lands). Step/fast_step mirror the
  # SPAD Arrow profile (normal turn vs. quick spin). Values are set via the
  # standard *_SET events; if a JF-specific var ignores its event in-sim, drop
  # set_event for that row to write the SimVar directly instead.
  multi_panel:
    - type: multi_panel
      selector:
        - { code: 0, label: ALT, simvar: "AUTOPILOT ALTITUDE LOCK VAR",
            set_event: AP_ALT_VAR_SET_ENGLISH, step: 100, fast_step: 1000, min: 0, max: 99999 }
        - { code: 1, label: VS, simvar: "AUTOPILOT VERTICAL HOLD VAR",
            set_event: AP_VS_VAR_SET_ENGLISH, step: 100, fast_step: 1000, min: -9999, max: 9999 }
        - { code: 2, label: IAS, simvar: "AUTOPILOT AIRSPEED HOLD VAR",
            set_event: AP_SPD_VAR_SET, step: 1, fast_step: 10, min: 0, max: 360 }
        - { code: 3, label: HDG, simvar: "AUTOPILOT HEADING LOCK DIR",
            set_event: HEADING_BUG_SET, step: 1, fast_step: 10, min: 0, max: 359, rollover: true }
        - { code: 4, label: CRS, simvar: "NAV OBS:1",
            set_event: VOR1_SET, step: 1, fast_step: 10, min: 0, max: 359, rollover: true }
      ap_master: "AUTOPILOT MASTER"
      mode_var: "L:AUTOPILOT_MODE"
