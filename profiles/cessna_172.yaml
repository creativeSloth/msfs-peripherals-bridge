name: "Cessna 172 Skyhawk (G1000)"
description: "GA single-engine mapping. Axis codes/ranges confirmed by `scan` 2026-06-19; lever->function and L/R brake still need `monitor`."

aircraft_match:
  - "C172"
  - "Cessna 172"
  - "Skyhawk"

bindings:
  # Fulcrum One Yoke (calibrated 2026-06-20): ABS_X(0)=roll, ABS_Y(1)=pitch.
  # Roll 7..4089 (rest 2114), pitch 6..4080 (rest 2059) — self-centres near the
  # 2047 mid, so the 0.03 deadzone covers the small offset (no centre-aware
  # mapping needed). Direction confirmed: roll raw 0 = full LEFT; pitch raw
  # RISES pulling back (nose up), hence elevator invert:true. Sign assumes
  # AILERON_SET<0 = roll left and ELEVATOR_SET<0 = nose up — flip the invert if
  # an axis is reversed in the sim.
  yoke:
    - name: "Aileron (roll)"
      source: { kind: axis, code: 0 }
      action: { type: event, event: AILERON_SET }
      transform: { deadzone: 0.03, curve: expo, expo: 0.25, invert: true, out_min: -16383, out_max: 16383 }
    - name: "Elevator (pitch)"
      source: { kind: axis, code: 1 }
      action: { type: event, event: ELEVATOR_SET }
      transform: { deadzone: 0.03, curve: expo, expo: 0.25, invert: true, out_min: -16383, out_max: 16383 }
    # --- Yoke grip buttons (codes & labels in config/calibration.yaml) ---
    # Flight-deck functions, fire once on press. Gear & flaps stay on the
    # Saitek panels via SPAD.neXt (out of scope here).
    - name: "ATC window"           # 288 left grip, red button
      source: { kind: button, code: 288 }
      action: { type: event, event: ATC }
    - name: "Parking brake"        # 289 left grip, black button
      source: { kind: button, code: 289 }
      action: { type: event, event: PARKING_BRAKES }
    - name: "Fuel selector LEFT"   # 294 right rocker, left
      source: { kind: button, code: 294 }
      action: { type: event, event: FUEL_SELECTOR_LEFT }
    - name: "Fuel selector RIGHT"  # 295 right rocker, right
      source: { kind: button, code: 295 }
      action: { type: event, event: FUEL_SELECTOR_RIGHT }
    # NOT mapped yet:
    #   290 left rocker up -> "heading bug = current heading" needs a DYNAMIC
    #       value (read HEADING simvar, then HEADING_BUG_SET); a button can only
    #       send a fixed value, so this waits until the bridge can read simvars.
    #   291 left rocker down, 292/293 right grip black (lower/upper): unassigned.
    #   hat 16/17: unassigned (also needs direction-aware hat mapping).
    # Verify in-sim: ATC window event name may differ in MSFS 2024.

  # VirtualFly TQ6+: confirmed 2026-06-19. codes 0..5 left->right =
  # T1,T2,P1,P2,M1,M2 (each 0..4096). Direction: raw 0 = lever fully FORWARD =
  # full power / full rich; raw rises pulling back; detent ~3260 = idle/0%;
  # beyond detent = reverse/cut-off zone. So axis is inverted (raw 0 -> 100%).
  # C172 = single-engine, fixed-pitch prop -> only Throttle 1 + Mixture 1.
  tq6:
    - name: "Throttle 1"
      # raw_max=detent(3260): pulling past idle into the reverse zone clamps to
      # idle (a piston single has no reverse). invert so raw 0 = full power.
      source: { kind: axis, code: 0, raw_min: 0, raw_max: 3260 }
      action: { type: event, event: THROTTLE1_SET }
      transform: { invert: true, out_min: -16383, out_max: 16383 }
    - name: "Mixture 1"
      # full range to 4096 so the bottom reaches idle cut-off (mixture 0%).
      source: { kind: axis, code: 4, raw_min: 0, raw_max: 4096 }
      action: { type: event, event: MIXTURE1_SET }
      transform: { invert: true, out_min: -16383, out_max: 16383 }

  # Saitek Cessna Trim Wheel (confirmed 2026-06-20): single axis ABS_X, 0..1023,
  # BOUNDED (saturates at both ends, no wrap) so absolute mapping is correct.
  # Direction: wheel forward ("nose down") = raw 0, wheel back ("nose up") =
  # raw 1023. Maps raw 0 -> -16383 (nose-down trim), raw 1023 -> +16383
  # (nose-up trim); assumes ELEVATOR_TRIM_SET>0 = nose up — add invert:true if
  # reversed in the sim. Pot-based: small drift expected, no centre self-return.
  trim:
    - name: "Elevator trim"
      source: { kind: axis, code: 0 }
      action: { type: event, event: ELEVATOR_TRIM_SET }
      transform: { out_min: -16383, out_max: 16383 }

  # Saitek Rudder Pedals: ABS_RZ(5)=rudder (centred ~249/511);
  # Confirmed 2026-06-20: rudder ABS_RZ(5)=0..508 centre 252 (full left 0,
  # full right 508); toe brakes ABS_X(0)=LEFT, ABS_Y(1)=RIGHT, both 0..127.
  pedals:
    - name: "Rudder"
      source: { kind: axis, code: 5 }
      action: { type: event, event: RUDDER_SET }
      transform: { deadzone: 0.05, invert: true, out_min: -16383, out_max: 16383 }
    - name: "Brake left"
      source: { kind: axis, code: 0 }
      action: { type: event, event: AXIS_LEFT_BRAKE_SET }
      transform: { out_min: -16383, out_max: 16383 }
    - name: "Brake right"
      source: { kind: axis, code: 1 }
      action: { type: event, event: AXIS_RIGHT_BRAKE_SET }
      transform: { out_min: -16383, out_max: 16383 }
